apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cartservice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bel-dot/devops-test-project-gitops.git
    targetRevision: main
    path: charts/cartservice
    helm:
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-biliakov
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
